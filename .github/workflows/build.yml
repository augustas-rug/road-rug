name: Build

on:
  push:
    branches: [main, windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (x64 and ARM64, self-contained single file)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/RoadRug.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "out/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/win-x64/RoadRug.exe -DestinationPath dist/RoadRug-Windows-x64.zip -Force
          Compress-Archive -Path out/win-arm64/RoadRug.exe -DestinationPath dist/RoadRug-Windows-ARM64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Snapshot test (renders the scene and checks the physics)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/win-x64/RoadRug.exe -ArgumentList '--snapshot', "$pwd/snapshots-windows" -Wait -PassThru
          Get-Content snapshots-windows/report.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-windows
          path: snapshots-windows
      - uses: actions/upload-artifact@v4
        with:
          name: road-rug-windows
          path: dist/*.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          ./build.sh --zip
          mv dist/RoadRug.zip dist/RoadRug-macOS.zip
      - name: Snapshot test
        run: '"build/Road Rug.app/Contents/MacOS/RoadRug" --snapshot "$PWD/snapshots-macos"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-macos
          path: snapshots-macos
      - uses: actions/upload-artifact@v4
        with:
          name: road-rug-macos
          path: dist/RoadRug-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: road-rug-*
          merge-multiple: true
          path: dist
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Road Rug ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
